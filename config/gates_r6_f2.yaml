# Gates floor + R6 holonomic nav. SSoT.yaml is not read when this file is set.
#
#   python3 src/hound_nav/scripts/gates_floor_sim.py --config src/hound_nav/config/gates_r6_f2.yaml
#   HOUND_NAV_YAML=src/hound_nav/config/gates_r6_f2.yaml ros2 launch hound_core hound_nav.launch.py
#
# gates_f2.yaml points at gates_f2.pgm (0.05 m, from 6502_02.pdf). The sim publishes a 0.05 m crop.
# Map_config must stay the same size and resolution.

sim:
  map: ../../mushr/mushr_sim/maps/gates_f2.yaml
  map_res: 0.05
  map_size: 30.0
  viser_port: 8081

nav:
  enabled: true
  local_map_topic: /hound_mapping/local_map
  state_topic: /hound_fcu_control/control_state
  path_topic: /hound_fcu_control/mission/path
  goal_topic: /goal_pose
  plan_frame: map
  cmd_topic: /hound_nav/cmd_ackermann
  plan_topic: /hound_nav/local_plan
  plan_diagnostics_topic: /hound_nav/planner_diagnostics
  plan_markers_topic: /hound_nav/local_plan_arrows
  planner_hz: 1.0
  control_rate_hz: 20.0
  cruise_speed_mps: 0.0
  control_state_dims: 17
  track_ref_metric: screw
  screw_length_m: 1.0
  lookahead: 8.0
  wp_radius: 0.25
  mission_manager:
    enabled: false
  planner_cv_viz: false
  planner_cv_viz_window: hound_planner_vis
  planner_cv_viz_size: 320

  MPPI_config:
    ROLLOUTS: 1024
    TIMESTEPS: 16
    BINS: 1
    u_per_command: 1
    n_iter: 1
    viz_k: 12

  Map_config:
    map_size: 30.0
    map_res: 0.05

  Dynamics_config:
    file: mppi/mppi/Dynamics/HolonomicDynamicsTCUDA.py
    class: HolonomicDynamics
    dt: &dt 0.1
    car_length: &car_length 0.7
    car_width: &car_width 0.75

  Sampling_config:
    file: mppi/mppi/Sampling/HolonomicDeltaSampling.py
    class: HolonomicDeltaSampling
    control_dim: 3
    noise_0: 1.0
    noise_1: 1.0
    noise_2: 1.0
    scaled_dt: *dt
    temperature: 1.0
    min_vel: 0.0
    max_vel: 1.55
    vy_max: 0.55
    max_omega: 1.5

  Cost_config:
    file: hound_nav/hound_nav/holonomicTrackingCostCUDA.py
    class: HolonomicTrackingCost
    pos_w: 1.0
    speed_w: 0.1
    vy_w: 2.0
    omega_w: 0.1
    heading_w: 1.0
    scaling_factor: 1.0
    critical_RI: 0.5
    critical_vert_acc: 3.0
    roll_ditch_w: 50.0
    lethal_w: 50.0
    car_bb_length: *car_length
    car_bb_width: *car_width

  Planner_config:
    unstuck_expansions: 40000
    experiment_info_default:
      bidirectional: true
      resolution: [0.5, 1.571, 0.5, 0.5, 1.0]
      tolerance: 0.1
      epsilon: &epsilon [0.25, 0.25, 0.3, 0.5, 0.5, 1.0]
      backward_epsilon: *epsilon
      LCR: *epsilon
      max_level: 12
      division_factor: 1.414
      max_expansions: 5000
      hysteresis: 100
      goal_sampling_config:
        enabled: false
        space_type: SE2
        angular_dims: [2]
        num_samples: 32
        sigma: *epsilon
      preemptive_expansion: {enabled: true, min_preemptive: 50, max_preemptive: 100}
      node_info:
        node_type: holonomic_6D
        length: *car_length
        width: *car_width
        map_res: 0.05
        dt: *dt
        timesteps: 7
        ax_list: [-1.0, 0.0, 1.0]
        ay_list: [-1.0, 0.0, 1.0]
        alpha_list: [-1.0, 0.0, 1.0]
        accel_max: 1.0
        alpha_max: 0.5
        max_omega: 1.5
        max_vel: 1.55
        min_vel: 0.0
        vy_max: 0.55
        vy_floor: 0.2
        K_strafe: 0.25
        RI: 0.5
        max_vert_acc: 3.0
        max_theta: 30.0
        del_theta: 28.65
        del_vel: 2.5
        del_omega: 1.0
